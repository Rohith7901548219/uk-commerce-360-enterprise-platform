version: 2
sources:
  - name: warehouse
    schema: public
    tables:
      - name: fact_sales_transactions
        columns:
          - name: transaction_id
            data_tests: [unique, not_null]
          - name: stock_code
            data_tests:
              - relationships:
                  arguments:
                    to: source('warehouse', 'dim_product')
                    field: stock_code
      - name: fact_returns
      - name: dim_product
      - name: dim_customer
models:
  - name: mart_daily_sales
    columns:
      - name: date_key
        data_tests: [unique, not_null]
  - name: mart_customer_rfm
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
  - name: mart_customer_cohorts
    columns:
      - name: retention_rate
        data_tests: [not_null]
